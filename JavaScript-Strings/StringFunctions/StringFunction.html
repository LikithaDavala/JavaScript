<!DOCTYPE html>
<html>
    <head>
        <title>String Function</title>
        <script src="StringFunctions.js" defer></script>
    </head>
    <body>
        <h1>String Function in JavaScript</h1>
        <label for="lblString">Enter an String:</label>
        <textarea id="txtString" type="textarea" onkeyup="onClickStrengthLength()"></textarea>
        <button id="btnUpperCase" onclick="onClickUpperCase()">UpperCase</button>
        <button id="btnLowerCase" onclick="onClickLowerCase()">LowerCase</button>
        <button id="btnCamelCases" onclick="onClickCamelCase()">Camel Cases</button>
        <p id="pResult"></p>
    </body>
</html>

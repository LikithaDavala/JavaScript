<!DOCTYPE html>
<html>
    <head>
        <title>SubString in JavaScript</title>
        <script src="SubString.js" defer></script>
    </head>
    <body>
        <h1>SubString in JavaScript</h1>
        <label for="lblWord">Enter an Word:</label>
        <input id="txtWord" type="text" placeholder="Enter an Word">
        <label for="lblIndex">StartIndex:</label>
        <input id="txtStartIndex" type="number" placeholder="Enter an StartIndex">
        <label for="lblIndex">EndIndex:</label>
        <input id="txtEndIndex" type="number" placeholder="Enter an EndIndex">
        <button id="btnSubString" onclick="onClickSubString()">SubString</button>
        <p id="pResult"></p>
    </body>

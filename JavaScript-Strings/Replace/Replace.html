<!DOCTYPE html>
<html>
    <head>
        <title>Replace in JavaScript</title>
        <script src="Replace.js" defer></script>
    </head>
    <body>
        <h1>Replace in JavaScript</h1>
        <label for="lblWord">Enter an Word:</label>
        <input id="txtWord" type="text" placeholder="Enter an Word">
        <label for="lblOldWord">Old Word:</label>
        <input id="txtOldWord" type="text" placeholder="Enter an Old Word">
        <label for="lblNewWord">New Word:</label>
        <input id="txtNewWord" type="text" placeholder="Enter an New Word">
        <button id="btnReplace" onclick="onClickReplace()">Replace</button>
        <p id="pResult"></p>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>Cost Price</title>
    <script src="CostPrice.js" defer></script>
</head>

<body>
    <h1>Cost Price:</h1>
    <div class="container">
        <label>Enter your chocolate Price</label>
        <input id="txtChocolatePrice" type="number" placeholder="Enter a number"><br>
        <label>Enter your boxQuantity</label>
        <input id="txtBoxQuntity" type="number" placeholder="Enter a number"><br>
        <label>Enter your No of Boxes</label>
        <input id="txtNoOfBoxes" type="number" placeholder="Enter a number"><br>
        <label>Enter your Travelling Cost</label>
        <input id="txtTravellingCost" type="number" placeholder="Enter a number"><br>
        <label>Enter your New Price</label>
        <input id="txtSellingPrice" type="text" placeholder="Enter a number"><br>
        <button id="btnResult" onclick="onClickCostPrice()">Result</button>
    </div>
    <p id="pResult"></p>
</body>

</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage Example</title>

    <link rel="stylesheet" href="LocalStorage.css">
    <script src="LocalStorage.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Local Storage Example</h1>

        <label for="txtName">Enter Your Name:</label>
        <input type="text" id="txtName" placeholder="Enter your name">

        <button id="btnSave">Save Name</button>
        <button id="btnGet">Get Saved Name</button>
        <button id="btnRemove">Remove Name</button>

        <p id="result">Your result will appear here.</p>
    </div>

</body>
